<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - AgroTech">
        AgroTech
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background-color: #198754;
            color: white;
            padding-top: 20px;
        }

        .sidebar .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .sidebar .nav-link {
            color: white;
            padding: 12px 20px;
            margin-bottom: 5px;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .sidebar .nav-link i {
            width: 25px;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .topbar {
            background-color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

    </style>

    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<!-- =========================
     BARRA LATERAL
========================= -->

<div class="sidebar">

    <!-- LOGO -->
    <div class="logo">
        <i class="bi bi-tree-fill me-2"></i>
        AgroTech
    </div>

    <ul class="nav flex-column">

        <!-- INICIO -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/}">
                <i class="bi bi-house-door me-2"></i>
                Inicio
            </a>
        </li>

        <!-- EMPRESAS -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/empresas}">
                <i class="bi bi-building me-2"></i>
                Empresas
            </a>
        </li>

        <!-- MAQUINARIA -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/maquinaria}">
                <i class="bi bi-gear-wide-connected me-2"></i>
                Maquinaria
            </a>
        </li>

        <!-- ALERTAS -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/alertas}">
                <i class="bi bi-bell me-2"></i>
                Alertas
            </a>
        </li>

        <!-- INCIDENCIAS -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/incidencia/historial}">
                <i class="bi bi-exclamation-triangle me-2"></i>
                Incidencias
            </a>
        </li>

        <!-- USUARIO ADMIN -->
        <!-- Solo aparece para ADMINISTRADOR -->
        <li class="nav-item"
            sec:authorize="hasRole('ADMINISTRADOR')">

            <a class="nav-link"
               th:href="@{/usuarios/admin}">

                <i class="bi bi-people-fill me-2"></i>
                UsuarioAdmin

            </a>

        </li>

        <!-- TIPO MANTENIMIENTO -->
        <li class="nav-item">
            <a class="nav-link" th:href="@{/tipomantenimiento}">
                <i class="bi bi-tools me-2"></i>
                Tipo Mantenimiento
            </a>
        </li>

    </ul>

</div>


<!-- =========================
     CONTENIDO PRINCIPAL
========================= -->

<div class="main-content">

    <!-- TOPBAR -->
    <div class="topbar">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h5 class="mb-0">
                    AgroTech
                </h5>
            </div>

            <div>
                <i class="bi bi-person-circle fs-4"></i>
            </div>

        </div>

    </div>


    <!-- =========================
         AQUÍ SE CARGA CADA PÁGINA
    ========================= -->

    <div layout:fragment="content">
    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
