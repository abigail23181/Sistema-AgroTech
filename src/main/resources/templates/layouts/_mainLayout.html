<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - AgroTech">Sistema AgroTech</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Barra de Navegación -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-success fs-4" th:href="@{/home}">🌱 AgroTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/home}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/empresas}">Empresas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/maquinarias}">Maquinarias</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a th:href="@{/login}" class="btn btn-outline-danger btn-sm px-3">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- Contenido Dinámico Principal -->
<main class="container my-4 flex-grow-1">
    <div layout:fragment="content">
        <!-- Aquí se inyecta el panel unificado de tu vista -->
    </div>
</main>

<!-- Pie de Página -->
<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0 text-secondary small">&copy; 2026 Grupo 4 - Sistema AgroTech. Todos los derechos reservados.</p>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
