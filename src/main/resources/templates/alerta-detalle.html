<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Alerta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow" th:if="${alerta != null}">
        <div class="card-header bg-primary text-white">
            <h3>Detalle Ampliado de la Alerta #<span th:text="${alerta.id}"></span></h3>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <strong>Máquina:</strong> <span th:text="${alerta.maquinaria != null ? alerta.maquinaria.nombre : 'N/A'}"></span>
                </div>
                <div class="col-md-6">
                    <strong>Ubicación:</strong> <span th:text="${alerta.maquinaria != null ? alerta.maquinaria.ubicacion : 'N/A'}"></span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <strong>Tipo:</strong> <span th:text="${alerta.tipoMantenimiento != null ? alerta.tipoMantenimiento.nombre : 'N/A'}"></span>
                </div>
                <div class="col-md-6">
                    <strong>Estado:</strong> <span th:text="${alerta.estado}"></span>
                </div>
            </div>
            <hr>
            <h5>Observaciones Registradas:</h5>
            <p class="border p-2 bg-white rounded" th:text="${alerta.observaciones != null ? alerta.observaciones : 'Sin observaciones'}"></p>

            <h5 class="mt-3">Historial de Mantenimientos Previos:</h5>
            <p class="border p-2 bg-white rounded" th:text="${alerta.historialMantenimientos != null ? alerta.historialMantenimientos : 'Sin historial registrado'}"></p>
        </div>
        <div class="card-footer">
            <a th:href="@{/alertas}" class="btn btn-secondary">Volver al listado</a>
        </div>
    </div>
</div>
</body>
</html>
