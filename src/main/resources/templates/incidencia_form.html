<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Incidencia de Maquinaria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title mb-0">Registrar Incidencia / Falla de Maquinaria</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/incidencias/guardar}" th:object="${incidencia}" method="post">

                <!-- Campo Severidad -->
                <div class="mb-3">
                    <label for="severidad" class="form-label">Severidad</label>
                    <select id="severidad" th:field="*{severidad}" class="form-select" required>
                        <option value="">-- Seleccionar Severidad --</option>
                        <option value="BAJA">Baja</option>
                        <option value="MEDIA">Media</option>
                        <option value="ALTA">Alta</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('severidad')}" th:errors="*{severidad}"></div>
                </div>

                <!-- Campo Fecha -->
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input type="date" id="fecha" th:field="*{fecha}" class="form-control" required />
                    <div class="text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
                </div>

                <!-- Campo Ubicación -->
                <div class="mb-3">
                    <label for="ubicacion" class="form-label">Ubicación</label>
                    <input type="text" id="ubicacion" th:field="*{ubicacion}" class="form-control" placeholder="Ej: Lote 4 / Taller Principal" required />
                    <div class="text-danger" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></div>
                </div>

                <!-- Campo Estado -->
                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select id="estado" th:field="*{estado}" class="form-select">
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="EN_PROCESO">En Proceso</option>
                        <option value="RESUELTO">Resuelto</option>
                    </select>
                </div>

                <!-- Botones de Acción -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Guardar Incidencia</button>
                    <!-- Redirección correcta al historial -->
                    <a th:href="@{/Templates/incidencia_historial.html}" class="btn btn-secondary" role="button">Ver Historial</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
