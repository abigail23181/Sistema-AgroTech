<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta - AgroTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 text-center">
                    <h3 class="fw-bold text-success mb-1">🌱 AgroTech</h3>
                    <p class="text-muted small mb-3">Crear nueva cuenta</p>

                    <div th:if="${param.errorCorreo}" class="alert alert-danger py-2 px-3 my-3 small text-start">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Solo se admiten correos @agrotech.com o @gmail.com.
                    </div>

                    <form th:action="@{/registro}" method="post">
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Juan Pérez" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" name="username" class="form-control" placeholder="correo@agrotech.com" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mt-2 fw-semibold">
                            <i class="bi bi-person-plus me-1"></i> Registrarse
                        </button>

                        <hr class="my-4 text-muted">

                        <p class="mb-0 small text-muted">
                            ¿Ya tienes una cuenta?
                            <a th:href="@{/login}" class="text-decoration-none text-success fw-bold">Iniciar Sesión</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
