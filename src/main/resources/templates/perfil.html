<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario - AgroTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container max-w-md">
    <div class="card border-0 shadow-sm rounded-4 p-4 mx-auto" style="max-width: 450px;">
        <div class="text-center">
            <i class="bi bi-person-circle text-success display-1"></i>
            <h4 class="fw-bold mt-2">Perfil de Usuario</h4>
            <p class="text-muted" th:text="${usuario}">correo@agrotech.com</p>
        </div>
        <hr>
        <div class="d-flex justify-content-between">
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary rounded-3"><i class="bi bi-arrow-left"></i> Volver al Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-danger rounded-3"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
        </div>
    </div>
</div>
</body>
</html>
