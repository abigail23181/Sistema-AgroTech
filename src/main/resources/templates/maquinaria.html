<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Maquinarias</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">🚜 Gestión de Maquinarias</h2>
        <button class="btn btn-success">+ Nueva Maquinaria</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre / Modelo</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(maquinarias)}">
                    <td colspan="3" class="text-center text-muted py-4">No hay maquinarias registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
