<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - AgroTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 text-center">
                    <h3 class="fw-bold text-success mb-1">🌱 AgroTech</h3>

                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show text-start py-2 px-3 my-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos.
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show text-start py-2 px-3 my-3 small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${param.exito}"></span>
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" name="username" class="form-control" placeholder="correo@agrotech.com o @gmail.com" required>
                        </div>
                        <div class="mb-3 text-start">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label small fw-semibold">Contraseña</label>
                                <a th:href="@{/recuperar}" class="text-decoration-none small text-success">¿Olvidaste tu contraseña?</a>
                            </div>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mt-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                        </button>

                        <hr class="my-4 text-muted">

                        <p class="mb-0 small text-muted">
                            ¿No tienes una cuenta?
                            <a th:href="@{/registro}" class="text-decoration-none text-success fw-bold">Crear nueva cuenta</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
