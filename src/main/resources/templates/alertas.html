<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alertas de Mantenimiento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-4">
    <!-- Encabezado con Botón para Crear -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Alertas de Mantenimiento</h2>
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevaAlerta">
            + Nueva Alerta
        </button>
    </div>

    <!-- Filtros -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/alertas}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Tipo de Alerta:</label>
                    <input type="text" name="tipoId" th:value="${tipoIdSel}" class="form-control" placeholder="Ej: Preventivo">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Máquina:</label>
                    <input type="text" name="maquinaId" th:value="${maquinaIdSel}" class="form-control" placeholder="Ej: Cosechadora">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ubicación / Finca:</label>
                    <input type="text" name="ubicacion" th:value="${ubicacionSel}" class="form-control" placeholder="Ej: Los Ángeles">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Mensaje si la lista está vacía -->
    <div th:if="${#lists.isEmpty(alertas)}" class="alert alert-info text-center">
        No hay alertas pendientes en el sistema.
    </div>

    <!-- Tabla de Alertas -->
    <div th:if="${!#lists.isEmpty(alertas)}" class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Máquina</th>
                <th>Ubicación</th>
                <th>Tipo Mantenimiento</th>
                <th>Fecha Límite</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${alertas}">
                <td th:text="${a.maquinaria != null ? a.maquinaria.nombre : 'N/A'}"></td>
                <td th:text="${a.maquinaria != null ? a.maquinaria.ubicacion : 'N/A'}"></td>
                <td th:text="${a.tipoMantenimiento != null ? a.tipoMantenimiento.nombre : 'N/A'}"></td>
                <td th:text="${a.fechaLimite}"></td>
                <td>
                        <span th:classappend="${a.estado != null && a.estado.toLowerCase().contains('vencida') ? 'badge bg-danger' :
                                               (a.estado != null && a.estado.toLowerCase().contains('próx') ? 'badge bg-warning text-dark' : 'badge bg-success')}"
                              th:text="${a.estado}">
                        </span>
                </td>
                <td>
                    <a th:href="@{/alertas/detalle/{id}(id=${a.id})}" class="btn btn-sm btn-info text-white">Ver Detalle</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para Crear Alerta en la misma Vista -->
<div class="modal fade" id="modalNuevaAlerta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Crear Nueva Alerta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/alertas/guardar}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Máquina:</label>
                        <input type="text" name="maquinaNombre" class="form-control" placeholder="Ej: Cosechadora 01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ubicación / Finca:</label>
                        <input type="text" name="ubicacion" class="form-control" placeholder="Ej: Finca Los Ángeles" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Mantenimiento:</label>
                        <input type="text" name="tipoNombre" class="form-control" placeholder="Ej: Preventivo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha Límite:</label>
                        <input type="date" name="fechaLimite" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estado:</label>
                        <select name="estado" class="form-select">
                            <option value="Próxima">Próxima</option>
                            <option value="Vencida">Vencida</option>
                            <option value="Atendida">Atendida</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones / Detalles:</label>
                        <textarea name="observaciones" class="form-control" rows="3" placeholder="Ingresa observaciones adicionales..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar Alerta</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
