<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Consultar Alertas de Mantenimiento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
  <h2 class="mb-4">Alertas de Mantenimiento</h2>

  <!-- Barra de Filtros -->
  <div class="card mb-4">
    <div class="card-body">
      <form th:action="@{/alertas}" method="get" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Tipo de Alerta</label>
          <input type="text" name="tipo" class="form-control" placeholder="Ej: Preventivo" th:value="${tipoFiltro}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Ubicación</label>
          <input type="text" name="ubicacion" class="form-control" placeholder="Ej: Campo Norte" th:value="${ubicacionFiltro}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Maquinaria</label>
          <select name="maquinariaId" class="form-select">
            <option value="">-- Todas las máquinas --</option>
            <option th:each="m : ${maquinarias}"
                    th:value="${m.idMaquinaria}"
                    th:text="${m.nombre} + ' (' + ${m.modelo} + ')'"
                    th:selected="${m.idMaquinaria == maquinariaFiltro}">
            </option>
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de Alertas -->
  <div class="table-responsive">
    <table class="table table-striped table-hover bg-white shadow-sm rounded">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Maquinaria</th>
        <th>Ubicación</th>
        <th>Tipo</th>
        <th>Fecha Límite</th>
        <th>Estado</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="alerta : ${alertas}">
        <td th:text="${alerta.id}">1</td>
        <td th:text="${alerta.maquinaria != null ? alerta.maquinaria.nombre : 'N/A'}">Tractor</td>
        <td th:text="${alerta.ubicacion}">Sector A</td>
        <td th:text="${alerta.tipo}">Preventivo</td>
        <td th:text="${alerta.fechaLimite}">2026-09-01</td>
        <td>
                        <span class="badge"
                              th:classappend="${alerta.estado == 'Pendiente' ? 'bg-warning text-dark' : 'bg-success'}"
                              th:text="${alerta.estado}">Pendiente</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(alertas)}">
        <td colspan="6" class="text-center text-muted">No se encontraron alertas registradas.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
