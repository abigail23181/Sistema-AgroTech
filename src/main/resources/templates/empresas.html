<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil de la Empresa - AgroTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-width: 260px; min-height: 100vh; background-color: #1e293b; color: #fff; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 15px; display: block; border-radius: 8px; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: #334155; color: #fff; }
    </style>
</head>
<body class="d-flex">

<!-- SIDEBAR -->
<div class="sidebar p-3 d-flex flex-column justify-content-between">
    <div>
        <h4 class="fw-bold text-white mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-tree-fill text-success"></i> AgroTech
        </h4>
        <nav class="d-flex flex-column gap-1">
            <a th:href="@{/}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a th:href="@{/empresas}" class="active"><i class="bi bi-building me-2"></i> Empresas</a>
            <a th:href="@{/maquinarias}"><i class="bi bi-truck me-2"></i> Maquinarias</a>
            <a th:href="@{/alertas}"><i class="bi bi-bell me-2"></i> Alertas</a>
            <a th:href="@{/incidencias}"><i class="bi bi-exclamation-triangle me-2"></i> Incidencias</a>
            <a th:href="@{/tipomantenimiento}"><i class="bi bi-tools me-2"></i> Mantenimientos</a>
            <a th:href="@{/usuarios}"><i class="bi bi-people-fill me-2"></i> Usuarios y Roles</a>
        </nav>
    </div>
    <div class="pt-3 border-top border-secondary">
        <a th:href="@{/perfil}" class="text-white mb-1"><i class="bi bi-person-circle me-2"></i> Ver Perfil</a>
        <a th:href="@{/logout}" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</a>
    </div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="flex-grow-1 p-4">

    <!-- MENSAJE DE ÉXITO -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}">Datos de la empresa actualizados correctamente</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- ENCABEZADO -->
    <div class="mb-4">
        <h3 class="fw-bold text-success mb-1">
            <i class="bi bi-building me-2"></i>Perfil de la Empresa
        </h3>
        <p class="text-muted small mb-0">Configuración general de los datos institucionales y representante legal.</p>
    </div>

    <!-- TARJETA DEL FORMULARIO -->
    <div class="card border-0 shadow-sm rounded-4 bg-white">
        <div class="card-body p-4">
            <form th:action="@{/empresas/guardar}" th:object="${empresa}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Nombre Comercial / Razón Social *</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control rounded-3" placeholder="Ej. AgroTech Solutions S.A." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Identificación Fiscal (NIT, RUC, CIF, RFC) *</label>
                        <input type="text" th:field="*{identificacionFiscal}" class="form-control rounded-3" placeholder="Ej. 0614-120590-101-2" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Dirección Principal / Ubicación de Planta *</label>
                    <input type="text" th:field="*{direccion}" class="form-control rounded-3" placeholder="Ej. Av. Principal, Zona Industrial #4" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Teléfono Central *</label>
                        <input type="text" th:field="*{telefono}" class="form-control rounded-3" placeholder="Ej. +503 2200-0000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Correo Electrónico Central *</label>
                        <input type="email" th:field="*{correo}" class="form-control rounded-3" placeholder="contacto@empresa.com" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Representante o Jefe de Mantenimiento *</label>
                        <input type="text" th:field="*{representante}" class="form-control rounded-3" placeholder="Ej. Ing. Roberto Gómez" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-secondary">Logotipo Institucional (.png, .jpg)</label>
                        <input type="file" name="logoFile" accept=".png, .jpg, .jpeg" class="form-control rounded-3">

                        <!-- VISTA PREVIA DEL LOGOTIPO GUARDADO -->
                        <div th:if="${empresa != null and empresa.logoUrl != null}" class="mt-3 text-center p-3 border rounded-3 bg-light">
                            <small class="d-block text-muted mb-2 fw-bold">Vista Previa del Logo Actual:</small>
                            <img th:src="${empresa.logoUrl}" alt="Logotipo Institucional" style="max-height: 100px; object-fit: contain;" class="img-fluid rounded">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end pt-2">
                    <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">
                        <i class="bi bi-floppy-fill me-2"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
