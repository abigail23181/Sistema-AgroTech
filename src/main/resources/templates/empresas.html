<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Empresas</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">🏢 Gestión de Empresas</h2>
        <button class="btn btn-success">+ Nueva Empresa</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="empresa : ${empresas}">
                    <td th:text="${empresa.idEmpresa}">1</td>
                    <td th:text="${empresa.nombre}">Nombre Empresa</td>
                    <td th:text="${empresa.direccion}">Dirección</td>
                    <td th:text="${empresa.telefono}">0000-0000</td>
                    <td th:text="${empresa.correo}">correo@ejemplo.com</td>
                </tr>
                <tr th:if="${#lists.isEmpty(empresas)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay empresas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
