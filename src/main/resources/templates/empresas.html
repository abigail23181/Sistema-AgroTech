<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil de la Empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card border-dark">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Configuración del Sistema > Perfil de la Empresa</h5>
        </div>
        <div class="card-body">

            <!-- Mensaje de éxito requerido por Criterio de Aceptación -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${mensajeExito}">Datos de la empresa actualizados correctamente</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Formulario con soporte Multipart para imágenes -->
            <form th:action="@{/empresas/guardar}" th:object="${empresa}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre Comercial / Razón Social:</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Identificación Fiscal (NIT, RUC, CIF, RFC):</label>
                        <input type="text" th:field="*{identificacionFiscal}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Dirección Principal / Ubicación de Planta:</label>
                    <input type="text" th:field="*{direccion}" class="form-control" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Teléfono Central:</label>
                        <input type="text" th:field="*{telefono}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Correo Electrónico Central:</label>
                        <input type="email" th:field="*{correo}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Representante o Jefe de Mantenimiento:</label>
                        <input type="text" th:field="*{representante}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Logotipo Institucional (.png, .jpg):</label>
                        <input type="file" name="logoFile" accept=".png, .jpg, .jpeg" class="form-control">

                        <!-- Vista Previa del Logotipo Guardado -->
                        <div th:if="${empresa.logoUrl != null}" class="mt-2 text-center p-2 border rounded bg-white">
                            <small class="d-block text-muted mb-1">Vista Previa del Logo Actual:</small>
                            <img th:src="${empresa.logoUrl}" alt="Logotipo Institucional" style="max-height: 90px; object-fit: contain;" class="img-fluid">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
