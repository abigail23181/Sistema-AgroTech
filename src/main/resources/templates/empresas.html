<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/_mainLayout}">
<head>
    <title>Empresas</title>
    <!-- Bootstrap Icons (asegúrate de incluirlo en tu layout principal o aquí) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">

        <!-- Tarjeta Principal -->
        <div class="card shadow-sm border-0 rounded-4">

            <!-- Encabezado -->
            <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-1 text-primary"><i class="bi bi-building me-2"></i>Gestión de Empresas</h3>
                    <p class="text-muted small mb-0">Administra las empresas registradas en la plataforma.</p>
                </div>
                <!-- Botón Crear -->
                <button class="btn btn-success px-3 rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCrear">
                    <i class="bi bi-plus-lg me-1"></i> Nueva Empresa
                </button>
            </div>

            <div class="card-body p-4">

                <!-- Tabla de Registros -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th class="py-3">ID</th>
                            <th class="py-3">Nombre</th>
                            <th class="py-3">Dirección</th>
                            <th class="py-3">Teléfono</th>
                            <th class="py-3">Correo</th>
                            <th class="py-3 text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${empresas}">
                            <td class="fw-bold" th:text="${e.idEmpresa}">1</td>
                            <td th:text="${e.nombre}">Nombre Empresa</td>
                            <td th:text="${e.direccion}">Dirección</td>
                            <td th:text="${e.telefono}">0000-0000</td>
                            <td th:text="${e.correo}">correo@ejemplo.com</td>

                            <!-- Botones de Acción -->
                            <td class="text-end">
                                <button class="btn btn-outline-primary btn-sm me-1"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalEditar-' + ${e.idEmpresa}">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-outline-danger btn-sm"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalEliminar-' + ${e.idEmpresa}">
                                    <i class="bi bi-trash"></i>
                                </button>

                                <!-- MODAL EDITAR -->
                                <div class="modal fade text-start" th:id="'modalEditar-' + ${e.idEmpresa}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content border-0 shadow">
                                            <form th:action="@{/empresas/guardar}" method="post">
                                                <div class="modal-header bg-primary text-white">
                                                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar Empresa</h5>
                                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <input type="hidden" name="idEmpresa" th:value="${e.idEmpresa}">

                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">Nombre</label>
                                                        <input type="text" name="nombre" class="form-control" th:value="${e.nombre}" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">Dirección</label>
                                                        <input type="text" name="direccion" class="form-control" th:value="${e.direccion}" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">Teléfono</label>
                                                        <input type="text" name="telefono" class="form-control" th:value="${e.telefono}" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">Correo Electrónico</label>
                                                        <input type="email" name="correo" class="form-control" th:value="${e.correo}" required>
                                                    </div>
                                                </div>
                                                <div class="modal-footer border-0">
                                                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>

                                <!-- MODAL ELIMINAR -->
                                <div class="modal fade text-start" th:id="'modalEliminar-' + ${e.idEmpresa}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered modal-sm">
                                        <div class="modal-content border-0 shadow">
                                            <div class="modal-body text-center pt-4">
                                                <i class="bi bi-exclamation-triangle text-danger display-4"></i>
                                                <h5 class="mt-3">¿Eliminar Empresa?</h5>
                                                <p class="text-muted small">Esta acción no se puede deshacer.</p>
                                            </div>
                                            <div class="modal-footer border-0 justify-content-center pb-4">
                                                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                                <a th:href="@{/empresas/eliminar/{id}(id=${e.idEmpresa})}" class="btn btn-danger px-4">Eliminar</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox display-6 d-block mb-2"></i>
                                No hay empresas registradas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL CREAR -->
    <div class="modal fade" id="modalCrear" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <form th:action="@{/empresas/guardar}" method="post">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Nueva Empresa</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: AgroTech S.A." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" name="direccion" class="form-control" placeholder="Ej: Av. Principal 123" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" placeholder="Ej: 2222-3333" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" name="correo" class="form-control" placeholder="contacto@empresa.com" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar Empresa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
