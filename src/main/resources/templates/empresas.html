<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AgroTech - Gestión de Empresas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-building text-success"></i> Gestión de Empresas - AgroTech</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEmpresa" onclick="limpiarFormulario()">
            <i class="fa-solid fa-plus"></i> Nueva Empresa
        </button>
    </div>

    <!-- Alertas -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>RUC/NIT</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${empresas}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.nombre}">Empresa Agro</td>
                    <td th:text="${e.ruc}">1234567890</td>
                    <td th:text="${e.correo}">contacto@empresa.com</td>
                    <td th:text="${e.telefono}">+503 7000-0000</td>
                    <td th:text="${e.direccion}">Calle Principal #123</td>
                    <td>
                        <span th:if="${e.estado}" class="badge bg-success">Activa</span>
                        <span th:unless="${e.estado}" class="badge bg-secondary">Inactiva</span>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-warning btn-sm me-1"
                                th:onclick="'editarEmpresa(' + ${e.id} + ', \'' + ${e.nombre} + '\', \'' + ${e.ruc} + '\', \'' + ${e.correo} + '\', \'' + ${e.telefono} + '\', \'' + ${e.direccion} + '\')'">
                            <i class="fa-solid fa-pen"></i>
                        </button>

                        <form th:action="@{/empresas/cambiar-estado/{id}(id=${e.id})}" method="post" class="d-inline">
                            <input type="hidden" name="estado" th:value="${!e.estado}">
                            <button type="submit"
                                    th:class="${e.estado ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm'}"
                                    th:title="${e.estado ? 'Inactivar' : 'Activar'}">
                                <i th:class="${e.estado ? 'fa-solid fa-ban' : 'fa-solid fa-check'}"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Formulario -->
<div class="modal fade" id="modalEmpresa" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/empresas/guardar}" th:object="${empresa}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nueva Empresa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" th:field="*{id}" id="empresaId">

                    <div class="mb-3">
                        <label class="form-label">Nombre de la Empresa</label>
                        <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">RUC / NIT</label>
                        <input type="text" th:field="*{ruc}" id="ruc" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" th:field="*{correo}" id="correo" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" id="telefono" class="form-control" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" th:field="*{direccion}" id="direccion" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function limpiarFormulario() {
        document.getElementById('modalTitle').innerText = 'Nueva Empresa';
        document.getElementById('empresaId').value = '';
        document.getElementById('nombre').value = '';
        document.getElementById('ruc').value = '';
        document.getElementById('correo').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('direccion').value = '';
    }

    function editarEmpresa(id, nombre, ruc, correo, telefono, direccion) {
        document.getElementById('modalTitle').innerText = 'Editar Empresa';
        document.getElementById('empresaId').value = id;
        document.getElementById('nombre').value = nombre;
        document.getElementById('ruc').value = ruc;
        document.getElementById('correo').value = correo;
        document.getElementById('telefono').value = telefono;
        document.getElementById('direccion').value = direccion;

        var modal = new bootstrap.Modal(document.getElementById('modalEmpresa'));
        modal.show();
    }
</script>
</body>
</html>
